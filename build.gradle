plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
processResources { filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc_version': project.minecraft_version } }
tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8'; it.options.release = 25 }
